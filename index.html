<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="icon.png" width="20">
        <span>Unhook Clone</span>
      </div>
      <div class="header-icons">
        <!-- Icons for Dark Mode / Power -->
      </div>
    </header>

    <div class="settings-list">
      <!-- Main Toggle -->
      <div class="setting-item">
        <label class="switch">
          <input type="checkbox" id="hideHome">
          <span class="slider"></span>
        </label>
        <span class="label-text">Hide Home Feed</span>
      </div>

      <!-- Nested Toggle -->
      <div class="setting-item nested">
        <label class="switch small">
          <input type="checkbox" id="redirectSubs">
          <span class="slider"></span>
        </label>
        <span class="label-text secondary">Redirect to Subscriptions</span>
      </div>
      
      <!-- Repeat for other items... -->
    </div>

    <footer>
      <a href="#">Donate</a>
      <a href="#">Request Feature</a>
      <a href="#">Support</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
