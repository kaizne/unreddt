<html>
  <head>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body id="container">
      <label for="switch">
         <span>Disable Infinite Scroll</span>
         <input type="checkbox" id="infiniteScrollToggle" role="switch">  
      </label>
      <label for="switch">
         <span>Hide Header</span>
         <input type="checkbox" id="headerToggle" role="switch">  
       </label>
      <label for="switch">
         <span>Hide Side Bar</span>
         <input type="checkbox" id="sidebarToggle" role="switch">  
       </label>
       <label for="switch">
         <span>Hide Popular Communities</span>
         <input type="checkbox" id="popularCommunitiesToggle" role="switch">  
       </label>
       <script src="popup.js"></script>
   </body>
</html>
